name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: mkdir -p lib && cp main.dart lib/main.dart
      - run: flutter create --platforms=android --org com.kutchhnusuraj --project-name kutchhnusuraj .
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's|android:label="[^"]*"|android:label="Kutchhnusuraj"|' android/app/src/main/AndroidManifest.xml
      - name: Check manifest
        run: |
          cat android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
      - name: Disable lint
        run: |
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle*
      - name: Download Gujarati font
        run: |
          mkdir -p fonts
          for w in Regular Medium SemiBold Bold; do curl -sSL --fail -o fonts/HindVadodara-$w.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/hindvadodara/HindVadodara-$w.ttf; done
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kutchhnusuraj-apk
          path: build/app/outputs/flutter-apk/app-release.apk
