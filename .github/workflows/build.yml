name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: mkdir -p lib && cp main.dart lib/main.dart
      - run: flutter create --platforms=android --org com.kutchhnusuraj --project-name kutchhnusuraj .
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's|android:label="[^"]*"|android:label="Kutchhnusuraj"|' android/app/src/main/AndroidManifest.xml
      - name: AdMob app id and min SDK
        run: |
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 24|' android/app/build.gradle*
      - name: Disable lint
        run: |
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle*
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: kutchhnusuraj-apk
          path: build/app/outputs/flutter-apk/app-release.apk
