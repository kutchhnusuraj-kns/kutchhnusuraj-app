name: kutchhnusuraj
description: Kutchhnusuraj news app
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  webview_flutter: ^4.9.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
flutter:
  uses-material-design: true
  assets:
    - logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: logo.png
flutter_native_splash:
  color: "#14110F"
  android_12:
    color: "#14110F"
